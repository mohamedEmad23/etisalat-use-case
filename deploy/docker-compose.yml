# Local demo stack: FastAPI telco-churn API + an LLM backend.
#
# DEFAULT (this file) — reuses a host LLM server: zero model downloads, seconds
# to start. On this machine that is the native Ollama at 127.0.0.1:11434, which
# already has qwen3 pulled (verified: a container reaches it via
# host.docker.internal, and it supports OpenAI-style response_format json_schema).
#
#   docker compose -f deploy/docker-compose.yml up -d
#   curl -s http://127.0.0.1:8000/health
#
# Image: uses telco-churn-api:local. Build it once (`... build`) or retag an
# existing local build:  docker tag telco-churn-api:phase5 telco-churn-api:local
#
# SELF-CONTAINED — run Ollama inside Docker instead (no host LLM needed; one-time
# multi-GB model pull into the telco-churn-ollama-models volume):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bundled-llm.yml up -d
#
# Secrets: repo-root .env via env_file — Compose ${} interpolation CANNOT see it
# (the project directory is deploy/, and interpolation .env is loaded only from
# there). Copy .env.example -> .env once and set TELCO_API_BEARER_TOKEN.
#
# Portability: on plain Linux Docker (not Docker Desktop), host.docker.internal
# needs `extra_hosts: ["host.docker.internal:host-gateway"]` or set
# TELCO_LLM_BASE_URL to a reachable address.
name: telco-churn

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: telco-churn-api:local
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    # Loopback only: local demo, no reason to expose the API on the LAN.
    # For a deliberate LAN demo, temporarily use "8000:8000".
    ports:
      - "127.0.0.1:8000:8000"
    # Repo-root .env — the single source of TELCO_API_BEARER_TOKEN. Do NOT add
    # the token under `environment:` below: environment entries win over
    # env_file, and a blank ${...} interpolation would silently override it.
    env_file:
      - ../.env
    environment:
      # Host LLM by default; the bundled overlay switches this to http://ollama:11434/v1.
      TELCO_LLM_BASE_URL: ${TELCO_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      TELCO_LLM_MODEL: ${TELCO_LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      TELCO_LLM_BACKEND: ollama
      TELCO_API_HOST: 0.0.0.0
      # Absolute path: immune to the container working directory.
      TELCO_DATA_CSV_PATH: /srv/app/data/WA_Fn-UseC_-Telco-Customer-Churn.csv
    volumes:
      # Artifacts: churn_artifact_seed*.joblib + reports (read-only).
      - ../runs:/srv/app/runs:ro
      # Challenge CSV: the chat baseline profile reads it at startup. Read-only.
      - ../data:/srv/app/data:ro
    # Hardening: immutable root filesystem; /tmp writable via tmpfs.
    read_only: true
    tmpfs:
      - /tmp
    # Readiness probe without curl (python:3.13-slim ships no curl): stdlib
    # urllib hits /health. start_period grants the baseline-profile build at
    # startup; probe failures inside it do not count toward retries.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    cpus: "2"
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]                 # uvicorn binds :8000 (unprivileged), reads mounts only
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536m
