# Self-contained overlay: run Ollama inside Docker (no host LLM required).
# Use together with the base file (default host-LLM settings are overridden here):
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bundled-llm.yml up -d
#
# One-time cost: model-init pulls qwen3 into the telco-churn-ollama-models
# volume (multi-GB; resumable — re-running `up` continues where it left off).
# The api waits for the pull (`service_completed_successfully`) before starting.
#
# Reproducible backend: version + digest pinned (recorded 2026-09-18).
# Re-resolve when bumping: docker manifest inspect ollama/ollama:0.34.2
x-ollama-image: &ollama_image ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532

services:
  ollama:
    image: *ollama_image
    init: true                     # PID-1 signal forwarding / zombie reaping insurance
    restart: unless-stopped        # survives daemon restarts; stops on `compose down`
    stop_grace_period: 30s
    # Deliberately NOT published on the host: a native Ollama may already own
    # 127.0.0.1:11434 (publishing would fail with "port is already allocated"),
    # and only the api needs to reach it — over the compose network at
    # http://ollama:11434. Inspect it from the host with:
    #   docker compose exec ollama ollama ls
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama   # weights persist across up/down/rebuild
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Keep the model resident between demo turns (default 5m: a longer pause
      # would pay a CPU cold-load on the next turn).
      OLLAMA_KEEP_ALIVE: 30m
      # One demo user at a time: a single runner halves KV-cache memory.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    # Sized for the Docker Desktop VM (9.7 GiB): 6g here + 1.5g for the api
    # leaves headroom for the VM itself. Limits mirrored at service and deploy
    # level with identical values (compose-spec consistency).
    cpus: "6"
    mem_limit: 6g
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 6g

  # One-shot model pre-pull. The pull client triggers the download server-side
  # (OLLAMA_HOST points at the ollama service; the weights land in its
  # ollama-models volume), so no volume mount is needed here. Re-pulls are
  # delta-safe: missing blobs only. Three attempts ride out a flaky link.
  model-init:
    image: *ollama_image
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Default must match the base file (shell TELCO_LLM_MODEL overrides both).
      TELCO_LLM_MODEL: ${TELCO_LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in 1 2 3; do
          echo "== ollama pull $$TELCO_LLM_MODEL attempt $$i/3 ==";
          ollama pull "$$TELCO_LLM_MODEL" && exit 0;
          echo "attempt $$i failed - retrying in 10s (completed blobs are kept)";
          sleep 10;
        done;
        exit 1
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Overlay the api: talk to the bundled Ollama and gate startup on the pull.
  api:
    environment:
      TELCO_LLM_BASE_URL: http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully

volumes:
  # Model weights live here: pulled once, reused by every later `up` — the whole
  # point of the volume. Only `docker compose ... down -v` deletes it.
  # Explicit name so it is stable regardless of project-name derivation.
  ollama-models:
    name: telco-churn-ollama-models
